                <div><dt>Extraction stopped</dt><dd>The service manual was quarantined. No extracted item is available.</dd></div>

<script>
  (() => {
    const root = document.getElementById("ayin-sources-discovery");
    const shell = document.getElementById("ayin-sources-shell");
    const sourceDetails = document.getElementById("ayin-sources-details");
    const records = [
      {
        id: "S-01", name: "Assembly BOM", type: "CSV", icon: "table-2", raw: "R-01",
        retention: "Retained as R-01",
        extraction: "Succeeded. Row 12 describes a mounting bracket.",
        status: "Bound", component: "C-01",
        binding: "Explicit sample binding from row 12 to component C-01."
      },
      {
        id: "S-02", name: "Assembly geometry", type: "STEP", icon: "box", raw: "R-02",
        retention: "Retained as R-02",
        extraction: "Partial. An assembly occurrence for the mounting bracket is available. The 3D derivative is unavailable.",
        status: "Unresolved",
        binding: "The similar label gives the engineer a lead, and an explicit binding decision is still needed."
      },
      {
        id: "S-03", name: "Service manual", type: "PDF", icon: "file-text", raw: "R-03",
        retention: "Retained as R-03",
        extraction: "Quarantined after a parse error. A diagnostic is available.",
        status: "Unavailable",
        binding: "This record has no extracted item to inspect for binding."
      },
      {
        id: "S-04", name: "Operational snapshot attempt", type: "", icon: "activity", raw: null,
        retention: "No raw payload captured",
        extraction: "Extraction did not run after acquisition failed.",
        status: "Unavailable",
        binding: "Unavailable for this attempt."
      }
    ];

    function sourceName(record) {
      const type = record.type ? " (" + record.type + ")" : "";
      return record.name + type;
    }

    function sourceLabel(record) {
      return record.id + " · " + sourceName(record);
    }

    function mount(variant, index) {
      variant.append(shell.content.cloneNode(true));
      const part = (name) => variant.querySelector('[data-part="' + name + '"]');
      const action = (name) => variant.querySelector('[data-action="' + name + '"]');
      const onDemand = part("on-demand");
      const details = sourceDetails.content.firstElementChild.cloneNode(true);
      const detailsControl = action("details");
      const isOnDemand = index === 1;
      const prefix = "ayin-workbench-" + (index + 1) + "-";
      let record = records[0];
      let itemOpen = false;
      let rawOpen = false;

      details.id = prefix + "details";
      detailsControl.setAttribute("aria-controls", details.id);
      details.hidden = isOnDemand;
      onDemand.hidden = !isOnDemand;
      (isOnDemand ? onDemand : part("rail-details")).append(details);
      part("rail-details").hidden = isOnDemand;

      const rawControl = action("raw");
      const itemControl = action("item");
      part("raw").id = prefix + "raw";
      part("item-detail").id = prefix + "locator";
      rawControl.setAttribute("aria-controls", part("raw").id);
      itemControl.setAttribute("aria-controls", part("item-detail").id);

      const sourceButtons = records.map((entry) => {
        const listItem = document.createElement("li");
        const button = document.createElement("button");
        const icon = document.createElement("i");
        const meta = document.createElement("span");
        const id = document.createElement("span");
        const label = document.createElement("span");
        button.type = "button";
        button.className = "aw-source cursor-interaction";
        button.setAttribute("aria-label", sourceLabel(entry));
        icon.setAttribute("data-lucide", entry.icon);
        icon.setAttribute("aria-hidden", "true");
        meta.className = "aw-source-meta";
        id.className = "aw-id aw-source-id";
        id.textContent = entry.id;
        meta.append(id);
        label.textContent = entry.name;
        if (entry.type) {
          const type = document.createElement("span");
          type.className = "aw-type";
          type.textContent = entry.type;
          meta.append(type);
        }
        label.append(meta);
        button.append(icon, label);
        button.addEventListener("click", () => {
          if (entry !== record) {
            record = entry;
            itemOpen = false;
            rawOpen = false;
            render();
          }
          if (isOnDemand) setDetails(false);
        });
        listItem.append(button);
        part("sources").append(listItem);
        return button;
      });

      function setDetails(open) {
        details.hidden = !open;
        detailsControl.setAttribute("aria-expanded", String(open));
      }

      function render() {
        sourceButtons.forEach((button, i) => {
          button.setAttribute("aria-current", String(records[i] === record));
        });
        variant.querySelectorAll("[data-evidence]").forEach((view) => {
          view.hidden = view.dataset.evidence !== record.id;
        });
        part("selected-id").textContent = record.id;
        part("selected-source").textContent = sourceName(record);
        part("retention").textContent = record.retention;
        part("extraction").textContent = record.extraction;
        part("binding-status").textContent = record.status;
        part("binding-status").dataset.status = record.status;
        part("component-row").hidden = !record.component;
        part("component-id").textContent = record.component ?? "";
        part("binding-copy").textContent = record.binding;
        part("item-detail").hidden = !itemOpen;
        itemControl.setAttribute("aria-expanded", String(itemOpen));
        part("item-label").textContent = itemOpen ? "Close" : "Open";
        part("raw").hidden = !rawOpen;
        rawControl.hidden = !record.raw;
        rawControl.setAttribute("aria-expanded", String(rawOpen));
        rawControl.textContent = rawOpen ? "Close raw record" : "Open raw record";
        part("raw-id").textContent = record.raw ?? "";
        part("raw-source").textContent = sourceLabel(record);
      }

      itemControl.addEventListener("click", () => {
        itemOpen = !itemOpen;
        render();
      });
      rawControl.addEventListener("click", () => {
        rawOpen = !rawOpen;
        render();
        if (isOnDemand) {
          setDetails(false);
          detailsControl.focus();
        }
      });

      if (isOnDemand) {
        detailsControl.addEventListener("click", () => setDetails(details.hidden));
        document.addEventListener("click", (event) => {
          if (!details.hidden && !onDemand.contains(event.target)) setDetails(false);
        });
        variant.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !details.hidden) {
            event.preventDefault();
            setDetails(false);
            detailsControl.focus();
          }
        });
      }

      variant.querySelectorAll(".aw-shell button").forEach((button) => {
        button.classList.add("cursor-interaction");
      });
      render();
    }

    root.querySelectorAll(":scope > [data-variant]").forEach(mount);
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  })();
</script>
